name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Add libc++_shared.so from the runner NDK
        run: |
          f=$(find "${ANDROID_NDK_HOME:-/usr/local/lib/android/sdk/ndk}" -name libc++_shared.so -path "*aarch64-linux-android*" | head -1)
          echo "found: $f"
          test -n "$f"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$f" app/src/main/jniLibs/arm64-v8a/
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HussShear-apk
          path: app/build/outputs/apk/debug/app-debug.apk
